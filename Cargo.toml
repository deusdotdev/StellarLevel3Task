[workspace]
resolver = "2"
members = [
    "contracts/cash",
    "contracts/oracle",
    "contracts/equity",
    "contracts/desk",
]

[workspace.dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
